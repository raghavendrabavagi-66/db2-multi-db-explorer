<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">

<title>DB2 Migration Studio - Connection Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            background: #cbd5e1;

            background: #94a3b8;

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eaedff",

                        "primary-container": "#2563eb",
                        "on-secondary-container": "#54647a",

                    "borderRadius": {

                    "fontFamily": {
                        "code-sm": ["Fira Code"],

<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- BACKGROUND: DIMMED APP UI (Simulated context) -->
<div class="fixed inset-0 z-0 opacity-40 grayscale blur-[2px] pointer-events-none">
<!-- TopNavBar Mock -->
<header class="flex justify-between items-center h-12 px-margin-edge w-full bg-surface-container-low border-b border-outline-variant">
<div class="font-headline-md font-bold text-on-surface">DB2 Migration Studio</div>
<div class="flex gap-md items-center">
<div class="h-8 w-64 bg-surface-container rounded border border-outline-variant"></div>
<div class="flex gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-high"></div>
<div class="w-8 h-8 rounded-full bg-surface-container-high"></div>
</div>
</div>
</header>
<!-- Main Content Area Mock -->
<div class="flex h-screen">
<aside class="w-[280px] bg-surface-container-low border-r border-outline-variant p-md">
<div class="space-y-md">
<div class="h-10 w-full bg-primary-container opacity-20 rounded"></div>
<div class="h-8 w-full bg-surface-container-high rounded"></div>
<div class="h-8 w-full bg-surface-container-high rounded"></div>
</div>
</aside>
<main class="flex-1 p-xl">
<div class="grid grid-cols-12 gap-lg">
<div class="col-span-12 h-64 bg-surface-container-lowest border border-outline-variant rounded"></div>
<div class="col-span-4 h-48 bg-surface-container-lowest border border-outline-variant rounded"></div>
<div class="col-span-4 h-48 bg-surface-container-lowest border border-outline-variant rounded"></div>
<div class="col-span-4 h-48 bg-surface-container-lowest border border-outline-variant rounded"></div>
</div>
</main>
</div>
</div>
<!-- MODAL OVERLAY: CONNECTION SETUP -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-on-surface/40 backdrop-blur-sm">
<!-- Main Connection Container -->
<div class="w-full max-w-[900px] bg-surface-container-lowest shadow-2xl border border-outline-variant flex flex-col animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="px-xl py-lg border-b border-outline-variant flex items-center justify-between">
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">New Comparison Project</h1>
<p class="font-body-sm text-body-sm text-secondary mt-xs">Configure your source and target data environments</p>
</div>
<button aria-label="Close modal" id="sc-close-btn" type="button" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-outline">close</span>
</button>
</div>
<!-- Two-Column Connection Fields -->
<div class="flex divide-x divide-outline-variant bg-white">
<!-- Left: GitLab Source -->
<div class="flex-1 p-xl">
<div class="flex items-center gap-sm mb-lg">
<div class="w-10 h-10 bg-surface-container flex items-center justify-center rounded">
<span class="material-symbols-outlined text-primary" data-icon="database">database</span>
</div>
<div>
<h2 class="font-title-sm text-title-sm text-on-surface">GitLab Source</h2>
<p class="font-label-caps text-label-caps text-secondary uppercase">Project Repository</p>
</div>
</div>
<div class="space-y-md"><div class="space-y-xs mb-md"><label class="font-label-caps text-label-caps text-on-surface">Source Repository</label><div id="sc-gitlab-repo-label" class="flex items-center gap-xs text-body-md"><!-- injected from db2_explorer/gitlab/client.py --></div></div><div class="space-y-xs"><label class="font-label-caps text-label-caps text-on-surface">Personal Access Token</label><input id="sc-gitlab-token" class="w-full h-10 px-md border border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md" placeholder="glpat-xxxxxxxxxxxx" type="password"></div>

<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface">BRANCH</label>
<div class="flex gap-sm items-center">
  <div class="relative flex-1">
    <select id="sc-branch" class="w-full h-10 pl-md pr-10 border border-outline appearance-none focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md">
      <option value="">Select a branch…</option>
    </select>
    <span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined pointer-events-none text-outline">expand_more</span>
  </div>
  <button id="sc-branch-refresh" type="button" class="h-10 w-10 rounded border border-outline-variant hover:bg-surface-container-low text-secondary transition-colors flex items-center justify-center shrink-0" title="Refresh branches">
    <span class="material-symbols-outlined text-[20px]">refresh</span>
  </button>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface">DATABASE FOLDER</label>
<select id="sc-database" class="w-full h-10 pl-md pr-10 border border-outline appearance-none focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md">
  <option value="">Select a database folder…</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface">SERVER FOLDER</label>
<select id="sc-server" class="w-full h-10 pl-md pr-10 border border-outline appearance-none focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md">
  <option value="">Select a server folder…</option>
</select>
</div><div class="pt-xs">
  <button id="sc-load-deployment" type="button" class="h-9 px-md border border-outline-variant bg-surface-container-low text-on-surface font-label-caps text-label-caps flex items-center gap-xs hover:bg-surface-container-high transition-colors rounded">
    <span class="material-symbols-outlined text-[18px]">folder_open</span>
    Load Deployment
  </button>
</div>
</div>
</div>
<!-- Right: Azure SQL Target -->
<div class="flex-1 p-xl">
<div class="flex items-center gap-sm mb-lg">
<div class="w-10 h-10 bg-surface-container flex items-center justify-center rounded">
<span class="material-symbols-outlined text-tertiary" data-icon="cloud">cloud</span>
</div>
<div>
<h2 class="font-title-sm text-title-sm text-on-surface">Azure SQL Target</h2>
<p class="font-label-caps text-label-caps text-secondary uppercase">Production Instance</p>
</div>
</div>
<div class="space-y-md"><div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface">Azure SQL Server</label>
<input id="sc-az-server" class="w-full h-10 px-md border border-outline focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md" placeholder="az-db-prod-sql.database.windows.net" type="text">
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface">AUTHENTICATION</label>
<div class="flex flex-col gap-sm py-1">
  <label class="flex items-center gap-sm cursor-pointer group">
    <input id="sc-auth-entra" type="radio" name="auth_type_modal" value="entra" class="w-4 h-4 text-primary border-outline focus:ring-primary" checked="">
    <span class="text-body-sm text-on-surface group-hover:text-primary transition-colors">Microsoft Entra MFA</span>
  </label>
  <label class="flex items-center gap-sm cursor-pointer group">
    <input id="sc-auth-windows" type="radio" name="auth_type_modal" value="windows" class="w-4 h-4 text-primary border-outline focus:ring-primary">
    <span class="text-body-sm text-on-surface group-hover:text-primary transition-colors">Windows Authentication</span>
  </label>
  <label class="flex items-center gap-sm cursor-pointer group mt-1 ml-6">
    <input id="sc-az-trust-cert" type="checkbox" class="rounded border-outline text-primary focus:ring-primary w-4 h-4">
    <span class="text-body-sm text-on-surface group-hover:text-primary transition-colors">Trust Server certificate</span>
  </label>
</div>
</div>
<div class="space-y-xs"><label class="font-label-caps text-label-caps text-on-surface">Database Name</label>
<div class="flex gap-sm items-center">
  <div class="relative flex-1">
    <select id="sc-az-database" class="w-full h-10 pl-md pr-10 border border-outline appearance-none focus:border-primary focus:ring-1 focus:ring-primary rounded bg-white text-body-md">
      <option value="">Select a database…</option>
    </select>
    <span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined pointer-events-none text-outline">expand_more</span>
  </div>
  <button id="sc-az-load-dbs" type="button" class="h-10 w-10 rounded border border-outline-variant hover:bg-surface-container-low text-secondary transition-colors flex items-center justify-center shrink-0" title="Refresh databases">
    <span class="material-symbols-outlined text-[20px]">refresh</span>
  </button>
</div></div>
</div>
</div>
</div>
<!-- Comparison Selection (Options bar) -->

<!-- Full-Width Comparison Button -->
<div class="p-xl bg-surface-container-lowest border-t border-outline-variant">
<button type="button" id="sc-compare-btn" class="w-full h-14 bg-primary text-on-primary font-headline-md text-title-sm flex items-center justify-center gap-md hover:brightness-110 active:opacity-90 transition-all shadow-lg">
                    Compare Now
                    <span class="material-symbols-outlined">sync_alt</span>
</button>
</div>
</div>
</div>
<script id="sc-setup-bridge-placeholder"></script>


</body></html>
